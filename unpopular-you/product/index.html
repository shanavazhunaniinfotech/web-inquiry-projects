<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rooted Radiance Brightening Serum | Unpopular You</title>
  <meta name="description" content="A brightening serum that targets the look of dark spots while it hydrates.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FDFBF7">
  <link rel="icon" href="images/logo-up.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="product">
  <div id="chrome-top"></div>

  <main id="main">
    <!-- Above the fold, in the audit's order (#15–#17) -->
    <section class="pdp">
      <div class="wrap pdp__grid">
        <div class="gallery">
          <div class="gallery__thumbs" id="gThumbs" aria-label="Product images"></div>
          <div class="gallery__main" id="gMain"></div>
        </div>
        <div class="buy" id="buy"></div>
      </div>
    </section>

    <!-- Ingredient spotlight (#19) -->
    <section class="section bg-porcelain" aria-labelledby="spotTitle">
      <div class="wrap spot">
        <div class="spot__fig" id="spotFig" data-reveal></div>
        <div>
          <p class="eyebrow" data-reveal>Ingredient spotlight</p>
          <h2 class="h2" id="spotTitle" data-reveal style="margin:16px 0 28px">What's inside</h2>
          <div class="spot__list" id="spotList"></div>
        </div>
      </div>
    </section>

    <!-- Complete the routine (#20) -->
    <section class="section bg-rose" aria-labelledby="ctrT">
      <div class="wrap">
        <div class="sec-head">
          <p class="eyebrow" data-reveal>Complete the routine</p>
          <h2 class="h2" id="ctrT" data-reveal>Four steps, <span class="serif">one order</span></h2>
          <p class="lead" data-reveal>Each step is designed to layer with the next. Here's where this one fits.</p>
        </div>
        <div class="ctr" id="ctr"></div>
        <div class="ctr__cta" id="ctrCta" data-reveal></div>
      </div>
    </section>

    <!-- In real life + product FAQ (#24) -->
    <section class="section" aria-labelledby="pfaqT">
      <div class="wrap faq__grid">
        <div class="faq__aside">
          <p class="eyebrow" data-reveal>Questions</p>
          <h2 class="h2" id="pfaqT" data-reveal style="margin:16px 0 26px">Good to <span class="serif">know</span></h2>
          <div id="pdpVideo" style="max-width:280px" data-reveal></div>
        </div>
        <div id="pfaq" data-single data-reveal></div>
      </div>
    </section>

    <!-- Reviews (#18 — placed after FAQ) -->
    <section class="section bg-porcelain" id="reviews" aria-labelledby="revT">
      <div class="wrap">
        <div class="sec-head">
          <p class="eyebrow" data-reveal>Reviews</p>
          <h2 class="h2" id="revT" data-reveal>What customers <span class="serif">say</span></h2>
        </div>
        <div class="rsum" id="rsum" data-reveal></div>
        <div class="rlist" id="rlist"></div>
      </div>
    </section>

    <!-- Related -->
    <section class="section" aria-labelledby="relT">
      <div class="wrap">
        <div class="sec-head sec-head--row">
          <h2 class="h2" id="relT" data-reveal>You may <span class="serif">also love</span></h2>
          <div class="routine__bar">
            <button class="round" id="relPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
            <button class="round" id="relNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
        </div>
        <div class="rail" id="related"></div>
      </div>
    </section>
  </main>

  <div class="satc" id="satc" aria-label="Quick add to bag"></div>
  <div id="chrome-bottom"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
