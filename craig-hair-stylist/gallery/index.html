<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gallery | Hair Stylist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <style>
    .soon { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; background: radial-gradient(60% 60% at 10% 10%, #F1EAFB, transparent 60%), radial-gradient(60% 60% at 90% 90%, #FBF1CC, transparent 60%), var(--cream); }
    .soon .logo { justify-content: center; margin-bottom: 40px; }
    .soon .h2 { margin-bottom: 16px; }
    .soon p { max-width: 460px; margin: 0 auto 28px; }
    .soon__btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="soon">
    <div>
      <a href="../" class="logo">
        <svg class="logo__mark" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#E8DFF6"/><path d="M14 30c5-3 7.5-8 8-17 .5 9 3 14 8 17" fill="none" stroke="#2A2433" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="31" r="3" fill="#FBF8F3" stroke="#2A2433" stroke-width="1.6"/><circle cx="29" cy="31" r="3" fill="#FBF8F3" stroke="#2A2433" stroke-width="1.6"/><path d="M22 7.5l1 2.2 2.2 1-2.2 1-1 2.2-1-2.2-2.2-1 2.2-1z" fill="#C99A2E"/></svg>
        <span class="logo__word">Hair <i>Stylist</i></span>
      </a>
      <p class="eyebrow" style="justify-content:center"><span>✦</span> Gallery</p>
      <h1 class="h2">The full gallery is <em>coming soon.</em></h1>
      <p>We're curating our favourite cuts, colours and studio moments. In the meantime, browse the portfolio on the home page.</p>
      <div class="soon__btns">
        <a href="../#lookbook" class="btn btn--plum">View portfolio <span class="btn__arrow">→</span></a>
        <a href="../#book" class="btn btn--glass">Book your chair</a>
      </div>
    </div>
  </main>
</body>
</html>
