<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Souqna Prototype – Mobile & Tablet Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body { background: #0d0f16; color: #e8e9ef; overflow: hidden; }
  .mv { display: grid; grid-template-columns: 290px 1fr 320px; height: 100vh; }
  .mv-side { padding: 22px 18px; overflow: auto; border-right: 1px solid rgba(255,255,255,.07); }
  .mv-side .brand { color: #fff; margin-bottom: 6px; }
  .mv-side .brand small { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(255,255,255,.1); padding: 3px 7px; border-radius: 6px; }
  .mv-side > p { font-size: 12.5px; color: #8d91a3; margin: 8px 0 18px; }
  .grp { margin-bottom: 14px; }
  .grp h6 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: #6f7487; margin: 0 0 6px 10px; }
  .grp button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 11px; font-size: 13.5px; font-weight: 600; color: #c6c9d4; transition: background .2s; }
  .grp button:hover { background: rgba(255,255,255,.05); }
  .grp button.on { background: #fff; color: var(--ink); }
  .grp button i { width: 22px; height: 22px; border-radius: 7px; background: rgba(255,255,255,.08); display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; }
  .grp button.on i { background: var(--brand); color: #fff; }
  .mv-stage { position: relative; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #1c2130, #0d0f16 70%); }
  .stage-top { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 2; }
  .dev-seg { display: flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 4px; }
  .dev-seg button, .dev-seg a { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 99px; font-size: 13px; font-weight: 650; color: #b9bccb; }
  .dev-seg .on { background: #fff; color: var(--ink); }
  .dev-seg svg { width: 16px; height: 16px; }
  .device-wrap { transform-origin: center center; transition: transform .4s var(--ease); }
  .device { background: #050608; border-radius: 58px; padding: 14px; box-shadow: 0 0 0 2px #2a2e3b, 0 40px 100px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.06); position: relative; }
  .device iframe { display: block; border: 0; border-radius: 44px; background: #fff; }
  .device .notch { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #050608; border-radius: 20px; z-index: 2; pointer-events: none; }
  .device.tablet { border-radius: 40px; padding: 18px; }
  .device.tablet iframe { border-radius: 24px; }
  .device.tablet .notch { display: none; }
  .loading { position: absolute; inset: 14px; border-radius: 44px; background: #fff; display: grid; place-items: center; color: var(--muted); font-size: 13px; z-index: 1; transition: opacity .3s; pointer-events: none; }
  .loading.off { opacity: 0; }
  .mv-notes { padding: 26px 22px; overflow: auto; border-left: 1px solid rgba(255,255,255,.07); }
  .mv-notes .role { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #3ddc97; }
  .mv-notes h2 { font-size: 24px; color: #fff; margin: 6px 0 8px; letter-spacing: -.03em; }
  .mv-notes > p { font-size: 13.5px; color: #9ea2b3; margin-bottom: 18px; }
  .mv-notes ul { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 10px; }
  .mv-notes li { display: flex; gap: 10px; font-size: 13.5px; line-height: 1.45; color: #dfe1e8; }
  .mv-notes li svg { color: #3ddc97; width: 16px; height: 16px; margin-top: 2px; }
  .mv-notes .tip { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; font-size: 13px; color: #b9bccb; margin-bottom: 14px; }
  .mv-notes .tip b { color: #fff; }
  .navbtns { display: flex; gap: 8px; margin-top: 10px; }
  .navbtns button { flex: 1; height: 40px; border-radius: 12px; background: rgba(255,255,255,.08); color: #fff; font-weight: 650; font-size: 13px; }
  .navbtns button:hover { background: rgba(255,255,255,.14); }
  .m-select { display: none; }
  @media (max-width: 1180px) { .mv { grid-template-columns: 250px 1fr; } .mv-notes { display: none; } }
  @media (max-width: 860px) {
    body { overflow: auto; }
    .mv { display: block; height: auto; }
    .mv-side { display: none; }
    .m-select { display: flex; gap: 8px; align-items: center; padding: 12px 14px; position: sticky; top: 0; background: #0d0f16; z-index: 5; border-bottom: 1px solid rgba(255,255,255,.08); }
    .m-select select { flex: 1; height: 42px; border-radius: 12px; background: #1c2130; color: #fff; border: 1px solid rgba(255,255,255,.12); padding: 0 12px; font-weight: 600; min-width: 0; }
    .m-select a { height: 42px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 12px; background: #fff; color: var(--ink); font-weight: 700; font-size: 13px; white-space: nowrap; }
    .mv-stage { height: calc(100vh - 67px); padding-top: 54px; }
    .mv-notes { display: block; border: 0; padding: 26px 18px 40px; }
  }
</style>
</head>
<body data-root="../" data-screen="mobile" data-cart="off">
<div class="m-select"><select id="mSel" aria-label="Choose screen"></select><a id="mDesk" href="../">Desktop</a></div>
<div class="mv">
  <aside class="mv-side">
    <a class="brand" href="../"><span class="brand-mark">S</span><span>Souqna</span> <small>Mobile</small></a>
    <p>Every screen of the prototype, running live on a phone or tablet. Tap and scroll inside the device.</p>
    <div id="list"></div>
  </aside>
  <main class="mv-stage" id="stage">
    <div class="stage-top">
      <div class="dev-seg" id="devSeg"><button class="on" data-dev="phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Phone</button><button data-dev="tablet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Tablet</button><a id="deskLink" href="../store/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Desktop</a></div>
    </div>
    <div class="device-wrap" id="wrap"><div class="device" id="device"><span class="notch"></span><div class="loading" id="loading">Loading screen…</div><iframe id="frame" title="Prototype screen" width="390" height="844"></iframe></div></div>
  </main>
  <aside class="mv-notes" id="notes"></aside>
</div>
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const list = SCREENS.filter(s => s.key !== 'hub');
  const roles = ['Customer', 'Vendor', 'Admin'];
  let cur = new URLSearchParams(location.search).get('s'); if (!list.find(s => s.key === cur)) cur = 'store';
  let dev = new URLSearchParams(location.search).get('d') === 'tablet' ? 'tablet' : 'phone';
  if (dev === 'tablet') document.querySelectorAll('[data-dev]').forEach(x => x.classList.toggle('on', x.dataset.dev === 'tablet'));
  $('list').innerHTML = roles.map(r => `<div class="grp"><h6>${r}</h6>${list.filter(s => s.role === r).map(s => `<button data-k="${s.key}"><i>${list.indexOf(s) + 1}</i>${s.title}</button>`).join('')}</div>`).join('') + `<div class="grp"><h6>Overview</h6><button onclick="location.href='../'"><i>←</i>Back to proposal overview</button></div>`;
  $('mSel').innerHTML = roles.map(r => `<optgroup label="${r}">${list.filter(s => s.role === r).map(s => `<option value="${s.key}">${list.indexOf(s) + 1}. ${s.title}</option>`).join('')}</optgroup>`).join('');
  function setNotes(s) {
    const i = list.indexOf(s);
    $('notes').innerHTML = `<span class="role">${s.role} · screen ${i + 1} of ${list.length}</span><h2>${s.title}</h2><p>What this screen covers from your brief:</p>
      <ul>${s.notes.map(n => `<li>${I.check}<span>${n}</span></li>`).join('')}</ul>
      <div class="tip"><b>Mobile-first details:</b> ${s.role === 'Customer' ? 'bottom tab bar, full-width search, swipeable rows, bottom-sheet filters and a slide-up cart.' : s.role === 'Vendor' ? 'thumb-friendly bottom navigation, large OTP inputs with SMS autofill, scrollable tables.' : 'bottom navigation for the key admin areas; approvals and payouts work one-handed.'}</div>
      <a class="btn btn-light btn-block" href="../${s.path}">Open desktop version</a>
      <div class="navbtns"><button data-step="-1" ${i ? '' : 'disabled style="opacity:.3"'}>← Previous</button><button data-step="1" ${i < list.length - 1 ? '' : 'disabled style="opacity:.3"'}>Next →</button></div>`;
  }
  function mark(k) {
    cur = k; const s = list.find(x => x.key === k);
    document.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    $('mSel').value = k; setNotes(s);
    $('deskLink').href = $('mDesk').href = '../' + s.path;
    history.replaceState(null, '', '?s=' + k + (dev === 'tablet' ? '&d=tablet' : ''));
  }
  function load(k) { const s = list.find(x => x.key === k); $('loading').classList.remove('off'); $('frame').src = '../' + s.path; mark(k); }
  $('frame').addEventListener('load', () => {
    $('loading').classList.add('off');
    try {
      const w = $('frame').contentWindow, p = w.location.pathname;
      const k = w.document.body.dataset.screen;
      if (k && list.find(x => x.key === k) && k !== cur) mark(k);
      $('deskLink').href = $('mDesk').href = w.location.href;
    } catch (e) {}
  });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (b) load(b.dataset.k);
    const st = e.target.closest('[data-step]'); if (st && !st.disabled) { const i = list.findIndex(x => x.key === cur) + +st.dataset.step; if (list[i]) load(list[i].key); }
    const d = e.target.closest('[data-dev]'); if (d) { dev = d.dataset.dev; document.querySelectorAll('[data-dev]').forEach(x => x.classList.toggle('on', x === d)); size(); }
  });
  $('mSel').onchange = e => load(e.target.value);
  function size() {
    const [w, h] = dev === 'phone' ? [390, 844] : [820, 1180];
    const f = $('frame'); f.width = w; f.height = h;
    $('device').classList.toggle('tablet', dev === 'tablet');
    const pad = dev === 'phone' ? 28 : 36;
    const st = $('stage').getBoundingClientRect();
    const availH = st.height - (innerWidth <= 860 ? 70 : 100), availW = st.width - 40;
    const sc = Math.min(1, availH / (h + pad), availW / (w + pad));
    $('wrap').style.transform = `scale(${sc})`;
    $('wrap').style.margin = `${-(h + pad) * (1 - sc) / 2 + (innerWidth <= 860 ? 0 : 24)}px ${-(w + pad) * (1 - sc) / 2}px`;
  }
  addEventListener('resize', size);
  size(); load(cur);
</script>
</body>
</html>
