<script>
window.BEDS_NOTES={admin:`
<h3>What your team does without a developer</h3>
<p>Every screen here matches a standard Shopify admin area or a well-supported app, so day-to-day changes never need custom code.</p>
<div class="note"><b>Locations</b><p>Settings → Locations. A new supplier warehouse gets its own stock, local pickup setting and freight origin. The freight app picks it up automatically.</p></div>
<div class="note"><b>Mattress positions</b><p>A product metafield on each bunk, trundle or single-over-double bed. Your team fills in size and max thickness, and the product page filters mattresses for each position.</p></div>
<div class="note"><b>Bed offer discount</b><p>One automatic discount with a %, the product types it applies to, and an exclusion list.</p></div>
<div class="note"><b>Pre-order + ETA</b><p>A pre-order app (selling plan) on the variant, with an ETA field shown on the product page, cart, checkout and confirmation email.</p></div>
<div class="note"><b>Low-stock email</b><p>Shopify Flow: when inventory drops to the threshold or below, email the admin.</p></div>
<div class="note"><b>Consignment notes</b><p>The freight app (e.g. Starshipit) adds a button to each order: create the connote, print the label, book the pickup.</p></div>`};
</script>
