  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body class="template-gift-card layout-standalone">
<main id="main">
<div class="gc">
  <header class="gc__head"><a class="logo" href="index.html" aria-label="Ocean Fine Jewellery, home"><svg class="logo__mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M5 18c3.5-4 7-4 11 0s7.5 4 11 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M5 12.5c3.5-4 7-4 11 0s7.5 4 11 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg><span class="logo__word">OCEAN</span></a><a class="link-arrow" href="index.html">Start shopping <span aria-hidden="true">→</span></a></header>
  <div class="gc__main">
    <p class="eyebrow">Gift card</p>
    <h1 class="gc__title">Here’s your <span data-money="100">$100.00</span> gift card for Ocean</h1>
    <div class="gc__card" role="img" aria-label="Ocean gift card worth $100.00">
      <div class="gc__card-top"><svg class="logo__mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M5 18c3.5-4 7-4 11 0s7.5 4 11 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M5 12.5c3.5-4 7-4 11 0s7.5 4 11 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg><span>OCEAN</span></div>
      <p class="gc__card-amount" data-money="100">$100.00</p>
      <p class="gc__card-foot">Gift card · No expiry date</p>
    </div>
    <div class="gc__code"><p class="mini-title">Use this code at checkout</p><p class="gc__code-value">OCEN 7H2K 9QWX 4F3M</p><button class="btn btn--outline" data-copy-code>Copy code</button></div>
    <div class="gc__grid">
      <div class="gc__qr"><div data-qr class="gc__qr-box"></div><p class="muted">Scan in store</p></div>
      <dl class="gc__balance"><div><dt>Balance</dt><dd data-money="100">$100.00</dd></div><div><dt>Expires</dt><dd>Never</dd></div></dl>
    </div>
    <div class="gc__actions">
      <button class="wallet-btn" data-wallet aria-label="Add to Apple Wallet"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M15 14h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span><small>Add to</small>Apple Wallet</span></button>
      <button class="btn btn--outline" data-print>Print gift card</button>
      <a class="btn btn--primary" href="collection.html">Start shopping</a>
    </div>
  </div>
</div>
</main>
<div class="toast" role="status" aria-live="polite" data-toast></div>
<script src="data.js"></script>
<script src="script.js"></script>
<script src="pages.js"></script>
</body>
</html>
